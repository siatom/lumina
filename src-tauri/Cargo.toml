[package]
name = "lumina"
version = "0.1.0"
description = "Lumina - a lightweight cross-platform image viewer"
authors = ["DevTeam"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Decoding pipeline. Features are restricted to the formats Lumina supports.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
] }

# Vector graphics (SVG) rasterisation for metadata / thumbnails / conversion.
# Pure Rust (usvg + tiny-skia), no native toolchain required.
# `raster-images` is disabled on purpose: it would pull a *second* copy of the
# gif / jpeg decoders (resvg vendors its own), and embedded bitmaps inside SVG
# are rare for icons/logos. `text` + system fonts are kept so `<text>` renders.
resvg = { version = "0.45", default-features = false, features = [
    "text",
    "system-fonts",
    "memmap-fonts",
] }

# Direct multi-page TIFF access (the `image` crate only exposes the first page).
# Same major version as the one `image` already pulls in, so no duplicate build.
tiff = "0.11"

# Basic EXIF metadata reading.
kamadak-exif = "0.6"

# Bounded in-process LRU for generated thumbnails (pure Rust, no native deps).
lru = "0.12"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
