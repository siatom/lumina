[package]
name = "lumina"
version = "0.1.0"
description = "Lumina - a lightweight cross-platform image viewer"
authors = ["DevTeam"]
edition = "2024"
# `src/bin/gen-file-icons.rs` adds a second binary, which makes a bare
# `cargo run` ambiguous — and that is exactly what `tauri dev` runs. Name the
# app binary so the dev/build path stays `cargo run` with no extra flags.
default-run = "lumina"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Gates the icon-generation dev tool. Without this the tool would be part of
# every `cargo build`, including the release profile — where `lto = true` and
# `codegen-units = 1` would make it a second full LTO link for no reason, and
# would leave a stray binary beside the app in the bundle.
tools = []

# The icon generator is a development tool, not part of the app. `required-features`
# keeps it out of the default build graph; run it with:
#     cargo run --bin gen-file-icons --features tools
[[bin]]
name = "gen-file-icons"
path = "src/bin/gen-file-icons.rs"
required-features = ["tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Decoding pipeline. Features are restricted to the formats Lumina supports.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
] }

# Vector graphics (SVG) rasterisation for metadata / thumbnails / conversion.
# Pure Rust (usvg + tiny-skia), no native toolchain required.
# `raster-images` is disabled on purpose: it would pull a *second* copy of the
# gif / jpeg decoders (resvg vendors its own), and embedded bitmaps inside SVG
# are rare for icons/logos. `text` + system fonts are kept so `<text>` renders.
resvg = { version = "0.45", default-features = false, features = [
    "text",
    "system-fonts",
    "memmap-fonts",
] }

# Direct multi-page TIFF access (the `image` crate only exposes the first page).
# Same major version as the one `image` already pulls in, so no duplicate build.
tiff = "0.11"

# Basic EXIF metadata reading.
kamadak-exif = "0.6"

# Bounded in-process LRU for generated thumbnails (pure Rust, no native deps).
lru = "0.12"

# Filesystem notifications for the filmstrip. Each platform uses its native
# API through Rust bindings (FSEvents / inotify / ReadDirectoryChangesW), so
# there is no C toolchain to build — only the OS frameworks already present.
notify = "8.2.0"

# File association (Windows only). `winreg` is pure Rust over `windows-sys` FFI
# -- no C toolchain -- but it `compile_error!`s on non-Windows targets, so it
# must be a target-specific dependency. Both crates are already in Cargo.lock as
# transitive dependencies, so this promotes them rather than growing the tree.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
