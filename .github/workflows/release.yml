name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: windows-latest, rust-target: x86_64-pc-windows-msvc }
          - { os: macos-latest, rust-target: aarch64-apple-darwin }
          - { os: macos-latest, rust-target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, rust-target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust-target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Lumina ${{ github.ref_name }}
          releaseBody: "See the release notes for changes in this version."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          projectPath: .
          releaseAssetNamePattern: "[name]-[platform]-[arch]-[version][ext]"
          args: --target ${{ matrix.platform.rust-target }}
