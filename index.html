<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Lumina</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <header class="toolbar">
        <button id="btn-open" title="打开图片 (Ctrl+O)">打开</button>
        <span class="divider"></span>
        <button id="btn-prev" title="上一张 (←)">‹ 上一张</button>
        <button id="btn-next" title="下一张 (→)">下一张 ›</button>
        <span class="divider"></span>
        <button id="btn-zoom-out" title="缩小 (-)">−</button>
        <span id="zoom-label" class="zoom-label">100%</span>
        <button id="btn-zoom-in" title="放大 (+)">+</button>
        <button id="btn-fit" title="适应窗口 (0)">适应</button>
        <button id="btn-actual" title="原始大小 (1)">1:1</button>
        <span class="spacer"></span>
        <span id="file-label" class="file-label"></span>
        <button id="btn-info" title="显示/隐藏信息 (i)">信息</button>
      </header>

      <main class="stage" id="stage">
        <img id="viewer" alt="" draggable="false" />
        <p class="empty-hint" id="empty-hint">打开一张图片开始浏览</p>
      </main>

      <aside class="info-panel" id="info-panel" hidden>
        <h2 class="info-title">图片信息</h2>
        <dl class="info-list" id="info-list"></dl>
      </aside>

      <footer class="filmstrip">
        <div class="filmstrip-track" id="filmstrip"></div>
      </footer>
    </div>
  </body>
</html>
