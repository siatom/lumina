<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lumina — application icon source (1024x1024).

  Concept: an aperture/iris (光圈) with a warm light source (光) glowing
  through its hexagonal opening — the two ideas behind the name "Lumina"
  fused into one glyph.

  All presentation attributes are spelled out on every element (no group
  inheritance) so the file renders identically across rasterizers
  (librsvg / ImageMagick / browser).

  Geometry of the iris follows Lucide's "aperture" glyph (a 24x24, stroke-2
  icon proven legible at 16px), scaled 32x and translated by 128, with a
  slightly heavier stroke that survives small sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1420"/>
      <stop offset="1" stop-color="#1C2637"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#CDE7FF" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#6EA8FE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6EA8FE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.38" stop-color="#EAF4FF" stop-opacity="0.72"/>
      <stop offset="0.72" stop-color="#BFE0FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#BFE0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- board (squircle: rx = 0.219 * 1024) -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#board)"/>
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="222.5"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>

  <!-- light spilling out of the lens -->
  <circle cx="512" cy="512" r="300" fill="url(#halo)"/>

  <!-- the iris -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="#6EA8FE" stroke-width="44"/>

  <line x1="586" y1="384" x2="770" y2="702" fill="none" stroke="#6EA8FE" stroke-width="44" stroke-linecap="round"/>
  <line x1="438" y1="384" x2="806" y2="384" fill="none" stroke="#6EA8FE" stroke-width="44" stroke-linecap="round"/>
  <line x1="364" y1="512" x2="548" y2="194" fill="none" stroke="#6EA8FE" stroke-width="44" stroke-linecap="round"/>
  <line x1="438" y1="640" x2="254" y2="322" fill="none" stroke="#6EA8FE" stroke-width="44" stroke-linecap="round"/>
  <line x1="586" y1="640" x2="218" y2="640" fill="none" stroke="#6EA8FE" stroke-width="44" stroke-linecap="round"/>
  <line x1="660" y1="512" x2="476" y2="830" fill="none" stroke="#6EA8FE" stroke-width="44" stroke-linecap="round"/>

  <!-- the light in the middle -->
  <circle cx="512" cy="512" r="112" fill="url(#core)"/>
</svg>
